name: Dependabot Auto-Merge

on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
    pull_request_review:
        types: [submitted]
    check_suite:
        types: [completed]
    workflow_run:
        workflows: ['CI', 'Lighthouse CI']
        types: [completed]

permissions:
    contents: write
    pull-requests: write

jobs:
    auto-merge:
        name: Auto-merge Dependabot PRs
        runs-on: ubuntu-latest
        if: |
            github.event.pull_request.user.login == 'dependabot[bot]' ||
            (github.event.workflow_run && github.event.workflow_run.actor.login == 'dependabot[bot]')

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Fetch Dependabot metadata
              id: metadata
              uses: dependabot/fetch-metadata@v2
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Check if PR should be auto-merged
              id: check-merge
              run: |
                  # Default to not merging
                  echo "should_merge=false" >> $GITHUB_OUTPUT

                  UPDATE_TYPE="${{ steps.metadata.outputs.update-type }}"
                  echo "Update type: $UPDATE_TYPE"

                  # Auto-merge all patch/minor updates regardless of dependency type.
                  # Required CI checks must still pass before the merge actually lands
                  # (enforced by branch protection / the merge step below).
                  # Major updates - and grouped PRs whose highest bump is major - are
                  # left for manual review.
                  case "$UPDATE_TYPE" in
                      version-update:semver-patch)
                          echo "✅ Patch update - will auto-merge"
                          echo "should_merge=true" >> $GITHUB_OUTPUT
                          ;;
                      version-update:semver-minor)
                          echo "✅ Minor update - will auto-merge"
                          echo "should_merge=true" >> $GITHUB_OUTPUT
                          ;;
                      *)
                          echo "⚠️ Major update (or unknown) - requires manual review"
                          ;;
                  esac

            - name: Wait for CI checks
              if: steps.check-merge.outputs.should_merge == 'true'
              uses: actions/github-script@v8
              with:
                  script: |
                      const { owner, repo } = context.repo;
                      const pr_number = context.payload.pull_request?.number || context.payload.workflow_run?.pull_requests[0]?.number;

                      if (!pr_number) {
                        console.log('Could not determine PR number');
                        return;
                      }

                      // Wait up to 10 minutes for checks to complete
                      const maxAttempts = 20;
                      const delaySeconds = 30;

                      for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                        console.log(`Attempt ${attempt}/${maxAttempts}: Checking PR status...`);
                        
                        const { data: pr } = await github.rest.pulls.get({
                          owner,
                          repo,
                          pull_number: pr_number
                        });
                        
                        // Check if PR is mergeable
                        if (pr.mergeable_state === 'clean' || pr.mergeable_state === 'unstable') {
                          console.log(`PR is in mergeable state: ${pr.mergeable_state}`);
                          
                          // Get check runs
                          const { data: checkRuns } = await github.rest.checks.listForRef({
                            owner,
                            repo,
                            ref: pr.head.sha
                          });
                          
                          const requiredChecks = ['Test & Lint', 'Security Audit'];
                          const requiredChecksPassed = requiredChecks.every(checkName => {
                            const check = checkRuns.check_runs.find(run => run.name.includes(checkName));
                            return check && check.conclusion === 'success';
                          });
                          
                          if (requiredChecksPassed) {
                            console.log('All required checks passed!');
                            return;
                          } else {
                            console.log('Required checks not yet passed');
                          }
                        }
                        
                        if (attempt < maxAttempts) {
                          console.log(`Waiting ${delaySeconds} seconds before next check...`);
                          await new Promise(resolve => setTimeout(resolve, delaySeconds * 1000));
                        }
                      }

                      throw new Error('Timeout waiting for checks to complete');

            - name: Auto-merge PR
              if: steps.check-merge.outputs.should_merge == 'true'
              uses: actions/github-script@v8
              with:
                  script: |
                      const { owner, repo } = context.repo;
                      const pr_number = context.payload.pull_request?.number || context.payload.workflow_run?.pull_requests[0]?.number;

                      if (!pr_number) {
                        console.log('Could not determine PR number');
                        return;
                      }

                      try {
                        // Enable auto-merge
                        await github.rest.pulls.merge({
                          owner,
                          repo,
                          pull_number: pr_number,
                          merge_method: 'squash',
                          commit_title: `chore(deps): ${context.payload.pull_request?.title || 'update dependencies'}`,
                          commit_message: 'Auto-merged by Dependabot workflow'
                        });
                        
                        console.log(`Successfully merged PR #${pr_number}`);
                      } catch (error) {
                        console.log(`Failed to merge PR: ${error.message}`);
                        
                        // If merge fails, try to enable auto-merge for when checks pass
                        try {
                          await github.graphql(`
                            mutation enableAutoMerge($pullRequestId: ID!) {
                              enablePullRequestAutoMerge(input: {
                                pullRequestId: $pullRequestId,
                                mergeMethod: SQUASH
                              }) {
                                pullRequest {
                                  autoMergeRequest {
                                    enabledAt
                                  }
                                }
                              }
                            }
                          `, {
                            pullRequestId: context.payload.pull_request?.node_id
                          });
                          
                          console.log('Enabled auto-merge for when checks pass');
                        } catch (graphqlError) {
                          console.log(`Failed to enable auto-merge: ${graphqlError.message}`);
                        }
                      }

            # Only fire on the initial PR open so reviewers don't get a flood of
            # duplicate comments when the workflow re-runs on push / CI completion.
            - name: Add comment about manual review
              if: |
                  steps.check-merge.outputs.should_merge == 'false' &&
                  github.event_name == 'pull_request' &&
                  github.event.action == 'opened'
              uses: actions/github-script@v8
              with:
                  script: |
                      const { owner, repo } = context.repo;
                      const pr_number = context.payload.pull_request.number;
                      const updateType = '${{ steps.metadata.outputs.update-type }}';

                      const isMajor = updateType.includes('major');
                      const reason = isMajor
                        ? '**Major version update** (or grouped update containing a major bump) detected'
                        : '**Non patch/minor update** detected (update type could not be classified as patch or minor)';

                      const message = [
                        '👋 This Dependabot PR requires manual review:',
                        '',
                        '- ' + reason,
                        '',
                        'Update type reported by Dependabot: `' + (updateType || '(empty)') + '`',
                        '',
                        'Please review the changes and merge manually if appropriate.',
                      ].join('\n');

                      await github.rest.issues.createComment({
                        owner,
                        repo,
                        issue_number: pr_number,
                        body: message
                      });
