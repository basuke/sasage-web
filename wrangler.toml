name = "sasage-web"
pages_build_output_dir = ".svelte-kit/cloudflare"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# D1 database binding
# Migrations: pnpm wrangler d1 migrations apply sasage-web-db --remote
# Also bind `DB` in the Cloudflare Pages dashboard
# (Settings → Functions → D1 database bindings)
[[d1_databases]]
binding = "DB"
database_name = "sasage-web-db"
database_id = "da903698-8721-4858-9ec7-530fe08a56a1"
migrations_dir = "migrations"
